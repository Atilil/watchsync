name: "WatchSync"
guid: "aa4fe598-07fd-41b5-bf1d-65abab9980db"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "Atilili"
category: "General"
overview: "Sync watch history between copies of the same media (e.g. 4K and HD libraries)"
description: |
  Keeps the watched state, resume position, play count and last played date in sync
  between copies of the same movie or episode stored in different libraries
  (for example a 1080p and a 4K library), in both directions.

  Copies are matched by identity, never by file path: TMDB or IMDb for movies;
  the series TVDB or IMDb id plus season and episode numbers for episodes.
  A scheduled task realigns all copies after the fact, e.g. after files were moved.
artifacts:
  - "Jellyfin.Plugin.WatchSync.dll"
changelog: |
  - Fix the other copy's item page still showing "not watched" after a sync,
    until Jellyfin was restarted (the library view was already correct).
